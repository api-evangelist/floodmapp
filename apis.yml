aid: floodmapp
name: FloodMapp
description: >-
  FloodMapp is a flood intelligence technology company that provides real-time,
  impact-based flood forecasting and mapping for emergency managers, government
  agencies, and critical infrastructure operators. Its AI-driven hydrology and
  hydraulics models deliver street-level (1-meter resolution) flood impact
  forecasts, updated hourly, 24/7/365, using live rainfall, river and coastal
  gauge networks, and terrain data. Capabilities ship as three products —
  ForeCast (predictive), NowCast (real-time), and PostCast (post-event) —
  packaged into PREPARE and RESPOND solutions. FloodMapp delivers its data as
  GIS-native live feeds (OGC WMS/WFS layers) that integrate directly into Esri
  ArcGIS, ArcGIS Online, Google, Mapbox, and QGIS. The authenticated API surface
  at api.floodmapp.com is protected by AWS Cognito OAuth2/OIDC. FloodMapp is SOC 2
  Type II certified and serves customers across the United States and Australia.
